name: Production Deployment & Cloud Delivery Pipeline

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test_and_lint:
    name: 1. Test & Code Quality Audit
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: nexacore_admin
          POSTGRES_PASSWORD: nexacore_secret_pass
          POSTGRES_DB: nexacore_dw
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        volumes:
          - ${{ github.workspace }}/docker/postgres/init:/docker-entrypoint-initdb.d

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Lint Code
        run: |
          flake8 data_science/ tests/ --count --max-line-length=120 --ignore=E501,W503,E127,E221,E226,E231,E241,E261,E272,E302,E306,E402,E701,F401,F841,W291,W293,W391,W504 --show-source --statistics

      - name: Initialize Test Database & Data Marts
        env:
          POSTGRES_USER: nexacore_admin
          POSTGRES_PASSWORD: nexacore_secret_pass
          POSTGRES_DB: nexacore_dw
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5433
        run: |
          python scripts/ci_init_database.py

      - name: Execute Full Test Suite
        env:
          POSTGRES_USER: nexacore_admin
          POSTGRES_PASSWORD: nexacore_secret_pass
          POSTGRES_DB: nexacore_dw
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5433
          BYPASS_AUTH: "true"
        run: |
          python -m pytest tests/ -v --tb=short


  build_and_scan:
    name: 2. Container Build & Security Scan
    needs: test_and_lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build FastAPI Serving API Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile.api
          load: true
          tags: nexacore-api:latest

      - name: Security Scan (Trivy Container Vulnerability)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "nexacore-api:latest"
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"

  deploy_to_aws:
    name: 3. AWS ECS Deployment & Verification
    needs: build_and_scan
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, Tag & Push Images to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/nexacore-api:$IMAGE_TAG -f Dockerfile.api .
          docker push $ECR_REGISTRY/nexacore-api:$IMAGE_TAG
          docker build -t $ECR_REGISTRY/nexacore-agent:$IMAGE_TAG -f Dockerfile.mlops .
          docker push $ECR_REGISTRY/nexacore-agent:$IMAGE_TAG

      - name: Deploy Amazon ECS Task
        run: |
          echo "Deploying container tag ${{ github.sha }} to AWS ECS Fargate Cluster..."
