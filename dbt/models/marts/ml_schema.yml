version: 2

models:
  - name: ml_customer_churn_features
    description: "ML Feature Mart for Customer Churn Prediction with explicit temporal cutoff"
    columns:
      - name: customer_id
        description: "Primary key / Customer ID"
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id
      - name: segment_name
        description: "Customer segment name (e.g. Enterprise, SMB, Mid-Market)"
      - name: primary_state_province
        description: "Primary state or province location"
      - name: account_tenure_days
        description: "Days between account creation date and feature cutoff date"
      - name: total_orders_to_cutoff
        description: "Total order count placed on or before feature cutoff date"
      - name: total_spend_to_cutoff
        description: "Total net revenue spend USD on or before feature cutoff date"
      - name: avg_order_value_to_cutoff
        description: "Average order value USD on or before feature cutoff date"
      - name: recency_days_at_cutoff
        description: "Days since last order placed relative to feature cutoff date"
      - name: total_support_tickets_to_cutoff
        description: "Total customer support tickets created on or before cutoff date"
      - name: avg_csat_score_to_cutoff
        description: "Average customer satisfaction rating on or before cutoff date"
      - name: feature_cutoff_date
        description: "Fixed temporal feature cutoff date ('2026-05-01')"
      - name: is_churned_target
        description: "Target binary label (1=churned in 60d post-cutoff, 0=active)"
        data_tests:
          - not_null

  - name: ml_demand_forecasting_daily
    description: "ML Feature Mart for Daily Product Demand Forecasting with anti-leakage lag features"
    columns:
      - name: product_id
        description: "Product ID"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_id
      - name: date_key
        description: "Date surrogate key"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: full_date
        description: "Calendar date"
      - name: day_of_week
        description: "Day of week name"
      - name: month
        description: "Month of year integer"
      - name: is_weekend
        description: "Weekend flag (1=weekend, 0=weekday)"
      - name: product_name
        description: "Product catalog item name"
      - name: category_name
        description: "Product category taxonomy name"
      - name: supplier_name
        description: "Primary component supplier name"
      - name: units_sold_target
        description: "Daily units sold target label"
        data_tests:
          - not_null
      - name: daily_revenue
        description: "Total daily revenue USD generated by product"
      - name: daily_orders_count
        description: "Count of distinct orders containing product on date"
      - name: lag_7_units_sold
        description: "Historical units sold on date T - 7 (anti-leakage feature)"
      - name: lag_14_units_sold
        description: "Historical units sold on date T - 14 (anti-leakage feature)"
      - name: rolling_7_day_avg_units
        description: "7-day rolling avg units sold excluding current date T"
      - name: rolling_30_day_avg_units
        description: "30-day rolling avg units sold excluding current date T"

  - name: ml_inventory_stockout_risk
    description: "ML Feature Mart for Inventory Stockout Risk Classification"
    columns:
      - name: inventory_id
        description: "Inventory Item ID"
        data_tests:
          - not_null
          - unique
      - name: product_id
        description: "Product ID"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_id
      - name: product_name
        description: "Product catalog item name"
      - name: category_name
        description: "Product category name"
      - name: warehouse_id
        description: "Warehouse ID"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_warehouse')
                field: warehouse_id
      - name: warehouse_name
        description: "Fulfillment warehouse name"
      - name: warehouse_location
        description: "Warehouse geographic location"
      - name: snapshot_date
        description: "Inventory snapshot date ('2026-06-30')"
      - name: quantity_on_hand
        description: "Physical stock quantity on hand"
      - name: quantity_allocated
        description: "Stock quantity allocated to open orders"
      - name: quantity_available
        description: "Net stock available (quantity_on_hand - quantity_allocated)"
      - name: reorder_point
        description: "Minimum inventory threshold triggering reorder"
      - name: reorder_quantity
        description: "Standard reorder quantity batch size"
      - name: unit_cost
        description: "Unit cost USD"
      - name: unit_price
        description: "Unit retail price USD"
      - name: inventory_value_usd
        description: "Total asset value USD (quantity_on_hand * unit_cost)"
      - name: days_of_supply
        description: "Estimated days of supply based on run rate"
      - name: stockout_risk_flag_target
        description: "Stockout risk flag target label (1 if available < reorder point, else 0)"
        data_tests:
          - not_null

  - name: ml_machine_telemetry_features
    description: "ML Feature Mart for Machine Telemetry Anomaly Detection"
    columns:
      - name: telemetry_minute_key
        description: "1-minute rollup surrogate key"
        data_tests:
          - not_null
          - unique
      - name: machine_id
        description: "Machine ID"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_machine')
                field: machine_id
      - name: machine_type_name
        description: "Machine model equipment type name"
      - name: warehouse_id
        description: "Plant warehouse location ID"
      - name: warehouse_name
        description: "Plant warehouse name"
      - name: minute_timestamp
        description: "1-minute interval timestamp"
      - name: raw_event_count
        description: "Number of raw sensor ping events in 1-minute window"
      - name: avg_temperature_c
        description: "Average temperature in Celsius"
      - name: max_temperature_c
        description: "Peak temperature in Celsius"
      - name: temp_spread
        description: "Temperature spread (max - avg Celsius)"
      - name: avg_vibration_rms
        description: "Average vibration RMS"
      - name: max_vibration_rms
        description: "Peak vibration RMS"
      - name: avg_pressure_psi
        description: "Average operating pressure PSI"
      - name: avg_power_kw
        description: "Average power consumption kW"
      - name: rolling_10min_avg_temp
        description: "Backward-looking 10-minute rolling avg temperature"
      - name: rolling_10min_avg_vib
        description: "Backward-looking 10-minute rolling avg vibration"
      - name: anomaly_severity_score
        description: "Composite real-time anomaly severity score (normalized Z-proxy)"
