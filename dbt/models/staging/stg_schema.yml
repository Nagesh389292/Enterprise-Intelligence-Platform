version: 2

models:
  - name: stg_customers
    description: "Staging view for raw customers table"
    columns:
      - name: customer_id
        description: "Primary key UUID"
      - name: company_name
        description: "Company or customer legal business name"
      - name: industry
        description: "Industry vertical sector"
      - name: segment_id
        description: "Foreign key to customer_segments"
      - name: account_status
        description: "Account status (ACTIVE, SUSPENDED, PENDING)"
      - name: contact_email
        description: "Primary contact email address"
      - name: contact_phone
        description: "Primary contact phone number"
      - name: credit_limit
        description: "Approved credit limit USD"
      - name: created_at
        description: "Customer record creation timestamp"
      - name: _ingested_at
        description: "Ingestion pipeline load timestamp"

  - name: stg_customer_addresses
    description: "Staging view for raw customer_addresses table"
    columns:
      - name: address_id
        description: "Primary key UUID"
      - name: customer_id
        description: "Foreign key to customers"
      - name: address_type
        description: "Address classification (SHIPPING, BILLING)"
      - name: street_address
        description: "Physical street address"
      - name: city
        description: "City name"
      - name: state_province
        description: "State or province"
      - name: postal_code
        description: "Postal / ZIP code"
      - name: country_code
        description: "ISO 2-letter country code"
      - name: is_primary
        description: "Flag indicating primary address for customer"
      - name: created_at
        description: "Address creation timestamp"
      - name: _ingested_at
        description: "Ingestion pipeline load timestamp"

  - name: stg_customer_satisfaction
    description: "Staging view for raw customer_satisfaction table"
    columns:
      - name: survey_id
        description: "Primary key UUID"
      - name: ticket_id
        description: "Foreign key to support_tickets"
      - name: csat_score
        description: "Customer satisfaction score (1 to 5)"
      - name: survey_date
        description: "Date survey was completed"
      - name: feedback_comments
        description: "Optional customer feedback text"
      - name: _ingested_at
        description: "Ingestion pipeline load timestamp"

  - name: stg_customer_segments
    description: "Staging view for raw customer_segments table"
    columns:
      - name: segment_id
        description: "Primary key integer"
      - name: segment_code
        description: "Segment code identifier"
      - name: segment_name
        description: "Human-readable segment name"
      - name: min_annual_revenue
        description: "Minimum annual revenue threshold USD"
      - name: max_annual_revenue
        description: "Maximum annual revenue threshold USD"
      - name: _ingested_at
        description: "Ingestion pipeline load timestamp"

  - name: stg_failure_events
    description: "Staging view for raw failure_events table"
    columns:
      - name: failure_id
        description: "Primary key UUID"
      - name: machine_id
        description: "Foreign key to machines"
      - name: failure_type
        description: "Categorical failure code"
      - name: failure_timestamp
        description: "Timestamp when failure occurred"
      - name: downtime_hours
        description: "Duration of unplanned equipment downtime in hours"
      - name: repair_cost
        description: "Direct repair cost USD"
      - name: _ingested_at
        description: "Ingestion pipeline load timestamp"

  - name: stg_inventory
    description: "Staging view for raw inventory table"
    columns:
      - name: inventory_id
        description: "Primary key bigint"
      - name: warehouse_id
        description: "Foreign key to warehouses"
      - name: product_id
        description: "Foreign key to products"
      - name: quantity_on_hand
        description: "Physical stock quantity on hand"
      - name: quantity_allocated
        description: "Quantity allocated to outstanding orders"
      - name: reorder_point
        description: "Reorder threshold trigger level"
      - name: reorder_quantity
        description: "Standard reorder quantity batch size"
      - name: snapshot_date
        description: "Snapshot observation date"
      - name: _ingested_at
        description: "Ingestion pipeline load timestamp"

  - name: stg_machines
    description: "Staging view for raw machines table"
    columns:
      - name: machine_id
        description: "Primary key UUID"
      - name: serial_number
        description: "Manufacturer equipment serial number"
      - name: machine_type_id
        description: "Foreign key to machine_types"
      - name: warehouse_id
        description: "Foreign key to warehouses (plant location)"
      - name: installation_date
        description: "Equipment commissioning date"
      - name: status
        description: "Operational status (OPERATIONAL, MAINTENANCE, DECOMMISSIONED)"
      - name: _ingested_at
        description: "Ingestion pipeline load timestamp"

  - name: stg_machine_telemetry
    description: "Staging view for raw machine_telemetry table"
    columns:
      - name: telemetry_id
        description: "Primary key bigint"
      - name: machine_id
        description: "Foreign key to machines"
      - name: timestamp
        description: "Sensor reading event timestamp"
      - name: temperature_c
        description: "Operating temperature in Celsius"
      - name: vibration_rms
        description: "Vibration Root Mean Square"
      - name: pressure_psi
        description: "Operating pressure in PSI"
      - name: power_kw
        description: "Power consumption in kW"
      - name: _ingested_at
        description: "Ingestion pipeline load timestamp"

  - name: stg_machine_types
    description: "Staging view for raw machine_types table"
    columns:
      - name: machine_type_id
        description: "Primary key integer"
      - name: type_name
        description: "Machine model category name"
      - name: manufacturer
        description: "Equipment manufacturer company name"
      - name: model_number
        description: "Manufacturer model number string"
      - name: expected_lifespan_years
        description: "Design lifespan in years"
      - name: max_temp_c
        description: "Maximum safe operating temperature Celsius"
      - name: max_vibration_rms
        description: "Maximum safe vibration RMS threshold"
      - name: _ingested_at
        description: "Ingestion pipeline load timestamp"

  - name: stg_maintenance_events
    description: "Staging view for raw maintenance_events table"
    columns:
      - name: maintenance_id
        description: "Primary key UUID"
      - name: machine_id
        description: "Foreign key to machines"
      - name: maintenance_type
        description: "Maintenance classification (PREVENTIVE, CORRECTIVE)"
      - name: start_time
        description: "Maintenance activity start timestamp"
      - name: end_time
        description: "Maintenance activity completion timestamp"
      - name: cost
        description: "Total maintenance cost USD"
      - name: technician_notes
        description: "Technician service notes"
      - name: _ingested_at
        description: "Ingestion pipeline load timestamp"

  - name: stg_orders
    description: "Staging view for raw orders table"
    columns:
      - name: order_id
        description: "Primary key UUID"
      - name: order_number
        description: "Human-readable order sequence string"
      - name: customer_id
        description: "Foreign key to customers"
      - name: shipping_address_id
        description: "Foreign key to customer_addresses"
      - name: channel_id
        description: "Sales channel identifier"
      - name: order_status
        description: "Order status (DELIVERED, SHIPPED, PROCESSING, CANCELLED)"
      - name: order_timestamp
        description: "Purchase order placement timestamp"
      - name: promised_delivery_date
        description: "Contractual promised delivery date"
      - name: total_amount
        description: "Total gross order amount USD"
      - name: _ingested_at
        description: "Ingestion pipeline load timestamp"

  - name: stg_order_items
    description: "Staging view for raw order_items table"
    columns:
      - name: order_item_id
        description: "Primary key bigint"
      - name: order_id
        description: "Foreign key to orders"
      - name: product_id
        description: "Foreign key to products"
      - name: quantity
        description: "Quantity of items purchased"
      - name: unit_price
        description: "Unit price USD at purchase time"
      - name: discount_amount
        description: "Discount amount USD applied"
      - name: net_revenue
        description: "Net revenue USD (quantity * unit_price - discount)"
      - name: _ingested_at
        description: "Ingestion pipeline load timestamp"

  - name: stg_product_categories
    description: "Staging view for raw product_categories table"
    columns:
      - name: category_id
        description: "Primary key integer"
      - name: category_name
        description: "Product category taxonomy name"
      - name: parent_category_id
        description: "Self-referencing parent category ID"
      - name: _ingested_at
        description: "Ingestion pipeline load timestamp"

  - name: stg_products
    description: "Staging view for raw products table"
    columns:
      - name: product_id
        description: "Primary key UUID"
      - name: product_name
        description: "Product catalog item name"
      - name: sku
        description: "Stock Keeping Unit string"
      - name: category_id
        description: "Foreign key to product_categories"
      - name: supplier_id
        description: "Primary component supplier ID"
      - name: unit_cost
        description: "Unit manufacturing/purchase cost USD"
      - name: unit_price
        description: "Unit retail list price USD"
      - name: is_active
        description: "Active catalog status flag"
      - name: created_at
        description: "Product creation timestamp"
      - name: _ingested_at
        description: "Ingestion pipeline load timestamp"

  - name: stg_suppliers
    description: "Staging view for raw suppliers table"
    columns:
      - name: supplier_id
        description: "Primary key UUID"
      - name: supplier_name
        description: "Supplier legal company name"
      - name: contact_name
        description: "Supplier point of contact name"
      - name: contact_email
        description: "Supplier contact email"
      - name: contact_phone
        description: "Supplier contact phone"
      - name: country_code
        description: "ISO 2-letter country code"
      - name: reliability_score
        description: "Historical supplier reliability rating (1.00 to 5.00)"
      - name: created_at
        description: "Supplier record creation timestamp"
      - name: _ingested_at
        description: "Ingestion pipeline load timestamp"

  - name: stg_support_tickets
    description: "Staging view for raw support_tickets table"
    columns:
      - name: ticket_id
        description: "Primary key UUID"
      - name: ticket_number
        description: "Human-readable support ticket sequence string"
      - name: customer_id
        description: "Foreign key to customers"
      - name: category
        description: "Support ticket issue classification"
      - name: priority
        description: "Ticket priority (LOW, MEDIUM, HIGH, URGENT)"
      - name: status
        description: "Ticket resolution status (CLOSED, RESOLVED, IN_PROGRESS, OPEN)"
      - name: created_at
        description: "Ticket submission timestamp"
      - name: resolved_at
        description: "Ticket resolution timestamp"
      - name: _ingested_at
        description: "Ingestion pipeline load timestamp"

  - name: stg_warehouses
    description: "Staging view for raw warehouses table"
    columns:
      - name: warehouse_id
        description: "Primary key UUID"
      - name: warehouse_code
        description: "Warehouse short code identifier"
      - name: warehouse_name
        description: "Fulfillment center facility name"
      - name: location
        description: "City / geographic facility location"
      - name: capacity_sqft
        description: "Facility footprint capacity in square feet"
      - name: _ingested_at
        description: "Ingestion pipeline load timestamp"
