version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nexacore_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexacore_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexacore_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-nexacore_dw}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexacore_admin -d nexacore_dw"]
      interval: 5s
      timeout: 5s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.0
    container_name: nexacore_mlflow
    ports:
      - "5000:5000"
    command: mlflow server --backend-store-uri sqlite:///mlflow.db --default-artifact-root ./mlruns --host 0.0.0.0 --port 5000
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 10s
      timeout: 5s
      retries: 3

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: nexacore_api
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-nexacore_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexacore_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-nexacore_dw}
      API_KEY: ${API_KEY:-nexacore_prod_secret_api_key_2026}
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  agent_service:
    build:
      context: .
      dockerfile: Dockerfile.mlops
    container_name: nexacore_agent_service
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-nexacore_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexacore_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-nexacore_dw}
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: nexacore_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deployment/observability/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - api

volumes:
  postgres_data:
  mlflow_data:
