<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%" style="background:#0a0d14; font-family:'Inter', sans-serif;">
  <defs>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121824" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1a2333" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="#0a0d14"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="260" height="675" fill="#121824" stroke="rgba(255,255,255,0.08)"/>
  <text x="30" y="50" font-size="18" font-weight="700" fill="#ffffff">NEXACORE</text>
  <text x="30" y="120" font-size="13" fill="#8a99ad">Executive Overview</text>
  <text x="30" y="160" font-size="13" fill="#8a99ad">Customer Intelligence</text>
  <text x="30" y="200" font-size="13" fill="#8a99ad">Demand Forecasting</text>
  <text x="30" y="240" font-size="13" fill="#8a99ad">Inventory Risk</text>
  <text x="30" y="280" font-size="13" fill="#8a99ad">Machine Operations</text>
  <rect x="16" y="300" width="228" height="40" rx="8" fill="rgba(127, 83, 172, 0.2)" stroke="#7f53ac"/>
  <text x="40" y="325" font-size="13" font-weight="600" fill="#7f53ac">AI Decision Center</text>

  <!-- Top Bar -->
  <text x="290" y="50" font-size="24" font-weight="700" fill="#ffffff">Stage 10 Multi-Agent Bus Audit Trail (5,863 Persisted)</text>

  <!-- Table Card -->
  <g transform="translate(290, 80)">
    <rect x="0" y="0" width="880" height="550" rx="14" fill="url(#card-grad)" stroke="rgba(255,255,255,0.08)"/>
    <text x="24" y="36" font-size="16" font-weight="700" fill="#ffffff">Collaborative Agent Reasoning Chains &amp; Verdict Audit</text>
    
    <line x1="24" y1="55" x2="856" y2="55" stroke="rgba(255,255,255,0.08)"/>
    <text x="24" y="80" font-size="11" font-weight="600" fill="#8a99ad">DECISION ID</text>
    <text x="160" y="80" font-size="11" font-weight="600" fill="#8a99ad">DOMAIN</text>
    <text x="260" y="80" font-size="11" font-weight="600" fill="#8a99ad">PROPOSED ACTION</text>
    <text x="450" y="80" font-size="11" font-weight="600" fill="#8a99ad">EXPOSURE (£)</text>
    <text x="580" y="80" font-size="11" font-weight="600" fill="#8a99ad">RISK LEVEL</text>
    <text x="710" y="80" font-size="11" font-weight="600" fill="#8a99ad">FINAL VERDICT</text>

    <!-- Row 1 -->
    <line x1="24" y1="100" x2="856" y2="100" stroke="rgba(255,255,255,0.04)"/>
    <text x="24" y="125" font-size="13" font-family="'JetBrains Mono'" fill="#00f2fe">DEC_OPS_301</text>
    <text x="160" y="125" font-size="13" fill="#ffffff">Operations</text>
    <text x="260" y="125" font-size="12" font-family="'JetBrains Mono'" fill="#8a99ad">EMERGENCY_MAINTENANCE</text>
    <text x="450" y="125" font-size="13" font-family="'JetBrains Mono'" fill="#ffffff">£12,500.00</text>
    <rect x="580" y="110" width="80" height="22" rx="4" fill="rgba(255,23,68,0.2)"/>
    <text x="592" y="125" font-size="11" font-weight="700" fill="#ff1744">CRITICAL</text>
    <rect x="710" y="110" width="135" height="22" rx="4" fill="rgba(255,171,0,0.2)"/>
    <text x="718" y="125" font-size="10" font-weight="700" fill="#ffab00">APPROVED_WITH_COND</text>
