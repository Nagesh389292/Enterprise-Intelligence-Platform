<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%" style="background:#0a0d14; font-family:'Inter', sans-serif;">
  <defs>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121824" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1a2333" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="#0a0d14"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="260" height="675" fill="#121824" stroke="rgba(255,255,255,0.08)"/>
  <text x="30" y="50" font-size="18" font-weight="700" fill="#ffffff">NEXACORE</text>
  <text x="30" y="120" font-size="13" fill="#8a99ad">Executive Overview</text>
  <rect x="16" y="140" width="228" height="40" rx="8" fill="rgba(0, 242, 254, 0.12)" stroke="#00f2fe"/>
  <text x="40" y="165" font-size="13" font-weight="600" fill="#00f2fe">Customer Intelligence</text>
  <text x="30" y="220" font-size="13" fill="#8a99ad">Demand Forecasting</text>
  <text x="30" y="260" font-size="13" fill="#8a99ad">Inventory Risk</text>
  <text x="30" y="300" font-size="13" fill="#8a99ad">Machine Operations</text>
  <text x="30" y="340" font-size="13" fill="#7f53ac">AI Decision Center</text>

  <!-- Top Bar -->
  <text x="290" y="50" font-size="24" font-weight="700" fill="#ffffff">Customer Churn Intelligence &amp; Interventions</text>

  <!-- Table Card -->
  <g transform="translate(290, 80)">
    <rect x="0" y="0" width="880" height="550" rx="14" fill="url(#card-grad)" stroke="rgba(255,255,255,0.08)"/>
    <text x="24" y="36" font-size="16" font-weight="700" fill="#ffffff">High Churn Risk Customer Intervention Desk</text>
    
    <line x1="24" y1="55" x2="856" y2="55" stroke="rgba(255,255,255,0.08)"/>
    <text x="24" y="80" font-size="11" font-weight="600" fill="#8a99ad">CUSTOMER ID</text>
    <text x="180" y="80" font-size="11" font-weight="600" fill="#8a99ad">CHURN PROBABILITY</text>
    <text x="360" y="80" font-size="11" font-weight="600" fill="#8a99ad">RISK TIER</text>
    <text x="500" y="80" font-size="11" font-weight="600" fill="#8a99ad">TOTAL REVENUE</text>
    <text x="650" y="80" font-size="11" font-weight="600" fill="#8a99ad">DAYS INACTIVE</text>
    <text x="780" y="80" font-size="11" font-weight="600" fill="#8a99ad">CSAT</text>

    <!-- Row 1 -->
    <line x1="24" y1="100" x2="856" y2="100" stroke="rgba(255,255,255,0.04)"/>
    <text x="24" y="125" font-size="13" font-family="'JetBrains Mono'" fill="#00f2fe">CUST_108</text>
    <text x="180" y="125" font-size="13" font-weight="700" fill="#ff1744">88.5%</text>
    <rect x="360" y="110" width="90" height="22" rx="4" fill="rgba(255,23,68,0.2)"/>
    <text x="372" y="125" font-size="11" font-weight="700" fill="#ff1744">High Risk</text>
    <text x="500" y="125" font-size="13" font-family="'JetBrains Mono'" fill="#ffffff">£4,500.00</text>
    <text x="650" y="125" font-size="13" fill="#ffffff">42 days</text>
    <text x="780" y="125" font-size="13" fill="#ffffff">2.1 / 5.0</text>

    <!-- Row 2 -->
    <line x1="24" y1="145" x2="856" y2="145" stroke="rgba(255,255,255,0.04)"/>
    <text x="24" y="170" font-size="13" font-family="'JetBrains Mono'" fill="#00f2fe">CUST_241</text>
    <text x="180" y="170" font-size="13" font-weight="700" fill="#ff1744">76.2%</text>
    <rect x="360" y="155" width="90" height="22" rx="4" fill="rgba(255,23,68,0.2)"/>
    <text x="372" y="170" font-size="11" font-weight="700" fill="#ff1744">High Risk</text>
    <text x="500" y="170" font-size="13" font-family="'JetBrains Mono'" fill="#ffffff">£3,200.00</text>
    <text x="650" y="170" font-size="13" fill="#ffffff">38 days</text>
    <text x="780" y="170" font-size="13" fill="#ffffff">2.8 / 5.0</text>

    <!-- Row 3 -->
    <line x1="24" y1="190" x2="856" y2="190" stroke="rgba(255,255,255,0.04)"/>
    <text x="24" y="215" font-size="13" font-family="'JetBrains Mono'" fill="#00f2fe">CUST_509</text>
    <text x="180" y="215" font-size="13" font-weight="700" fill="#ffab00">69.4%</text>
    <rect x="360" y="200" width="90" height="22" rx="4" fill="rgba(255,171,0,0.2)"/>
    <text x="372" y="215" font-size="11" font-weight="700" fill="#ffab00">Medium Risk</text>
    <text x="500" y="215" font-size="13" font-family="'JetBrains Mono'" fill="#ffffff">£8,900.00</text>
    <text x="650" y="215" font-size="13" fill="#ffffff">29 days</text>
    <text x="780" y="215" font-size="13" fill="#ffffff">3.0 / 5.0</text>
  </g>
</svg>
